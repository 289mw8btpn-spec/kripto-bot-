name: Kripto Takip Paneli

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kripto-panel-yayin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Dosyalari indir
        uses: actions/checkout@v4

      - name: Python hazirla
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verileri al ve mobil paneli olustur
        run: python bot.py

      - name: Pages ayarlarini hazirla
        uses: actions/configure-pages@v5

      - name: Yalnizca panel klasorunu yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Paneli yayinla
        id: deployment
        uses: actions/deploy-pages@v4
