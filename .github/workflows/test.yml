name: Kripto Takip Paneli

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kripto-takip
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dosyalari indir
        uses: actions/checkout@v4

      - name: Python hazirla
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Coin tablosunu guncelle
        run: python bot.py
